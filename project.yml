name: ChessCoach
options:
  bundleIdPrefix: com.chesscoach
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ChessboardKit:
    url: https://github.com/rohanrhu/ChessboardKit
    from: "1.1.2"
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient
    from: "0.5.0"

configs:
  Debug: debug
  Release: release
  AppStore: release
  DirectDownload: release

targets:
  ChessCoach:
    type: application
    platform: macOS
    sources:
      - ChessCoach
    preBuildScripts:
      - name: Copy Stockfish Engine
        showEnvVarsInLog: false
        script: |
          SRC="$SRCROOT/ChessCoach/Resources/Engines/stockfish"
          DST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/stockfish"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$DST"
            chmod +x "$DST"
          else
            echo "warning: Stockfish binary not found at $SRC"
            echo "warning: Run: cp /opt/homebrew/bin/stockfish ChessCoach/Resources/Engines/stockfish"
          fi
    dependencies:
      - package: ChessboardKit
        product: ChessboardKit
      # LocalLLMClient removed — using FoundationModels (Apple Intelligence) for inference
    settings:
      base:
        SWIFT_VERSION: "6.3"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chesscoach.ChessCoach
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ChessCoach/ChessCoach-Direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: ChessCoach/ChessCoach-Direct.entitlements
        AppStore:
          CODE_SIGN_ENTITLEMENTS: ChessCoach/ChessCoach.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: SANDBOXED
        DirectDownload:
          CODE_SIGN_ENTITLEMENTS: ChessCoach/ChessCoach-Direct.entitlements

  ChessCoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ChessCoachTests
    dependencies:
      - target: ChessCoach
    settings:
      base:
        SWIFT_VERSION: "6.3"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chesscoach.ChessCoachTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
